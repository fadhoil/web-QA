<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Recorder</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--bd:#d0d0d0;--mut:#666;--ok:#1a7f37;--bad:#c62828;--acc:#2563eb;--row:#f6f6f6}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--bd:#3a3a3a;--mut:#999;--ok:#4ade80;--bad:#f87171;--acc:#60a5fa;--row:#202020}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
button.tab.on{background:var(--acc);border-color:var(--acc)}
#url{flex:1;min-width:220px}
main{flex:1;display:flex;min-height:0}
#panel{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;padding:4px 4px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#tabs button{border-bottom-left-radius:0;border-bottom-right-radius:0;padding:3px 8px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs button.cur{border-color:var(--acc);font-weight:600}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#frames iframe:not(.act){display:none}
#list{width:220px;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;padding:8px;gap:6px}
#items{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
#items button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brand{padding-top:6px;text-align:center}
#brand img{display:block;max-width:100%;max-height:min(180px,22vh);width:auto;height:auto;margin:0 auto}
#items button.cur{border-color:var(--acc);font-weight:600}
aside{width:480px;border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#steps{flex:1;overflow:auto;padding:6px}
.step{display:grid;grid-template-columns:40px 92px 1fr 1fr 22px 22px 22px;gap:4px;margin-bottom:4px;padding:4px;background:var(--row);border-radius:6px;border-left:4px solid transparent}
.step.ok{border-left-color:var(--ok)}.step.bad{border-left-color:var(--bad)}
.step input,.step select,.step button{padding:3px 2px;min-width:0}
.step span{color:var(--mut);align-self:center;text-align:center}
#msg{padding:8px;border-top:1px solid var(--bd);color:var(--mut);min-height:36px;white-space:pre-wrap}
#login{position:fixed;inset:0;background:var(--bg);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" hidden>
  <input id="pw" type="password" placeholder="Password" autofocus>
  <button id="loginBtn">Masuk</button>
  <span id="pwerr" style="color:var(--bad)"></span>
</div>

<header>
  <input id="url" placeholder="https://website-yang-mau-di-QA.com" aria-label="URL website">
  <button id="go">Buka</button>
  <span id="recTools">
    <button id="rec">● Rekam</button>
    <button id="asrt" title="Klik elemen di website untuk jadikan assertion teks">✓ Assert</button>
  </span>
  <button id="run">▶ Jalankan</button>
  <label title="Ambil screenshot setiap langkah saat menjalankan (untuk laporan)"><input id="shot" type="checkbox" checked style="padding:0"> Screenshot</label>
</header>

<main>
  <section id="list">
    <button id="new">+ Skenario baru</button>
    <div style="display:flex;gap:4px"><input id="search" placeholder="Cari skenario…" aria-label="Cari skenario" style="flex:1;min-width:0"><button id="reload" title="Muat ulang daftar">⟳</button></div>
    <div id="items"></div>
    <div id="brand"><img src="logo.png" alt="ADO - Learn, Work, Play, Grow, Together"></div>
  </section>
  <section id="panel"><div id="tabs" hidden></div><div id="frames"></div></section>
  <aside>
    <header>
      <input id="name" placeholder="Nama skenario" style="flex:1;min-width:0">
      <button id="save">Simpan ke DB</button>
      <button id="dl">⬇ JSON</button>
    </header>
    <header>
      <button id="up">⬆ Upload (ganti)</button>
      <button id="merge" title="Tambahkan langkah dari satu atau beberapa file ke skenario sekarang">⊕ Gabung file</button>
      <input id="file" type="file" accept=".json" multiple hidden>
      <input id="mergefile" type="file" accept=".json" multiple hidden>
    </header>
    <div id="steps"></div>
    <header><button id="add">+ Langkah</button></header>
    <header>
      <select id="lang" aria-label="Bahasa laporan"><option value="id">Laporan: Indonesia</option><option value="en">Report: English</option></select>
      <select id="fmt" aria-label="Format laporan">
        <option value="html">HTML</option><option value="md">Markdown (.md)</option>
        <option value="pdf">PDF (cetak)</option><option value="docx">Word (.docx)</option>
      </select>
      <button id="exp" disabled>Ekspor hasil</button>
    </header>
    <div id="msg"></div>
  </aside>
</main>

<script src="jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const urlIn = $('#url'), box = $('#steps');
const api = (p, o) => fetch('/__qa/api/' + p, o);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const say = t => $('#msg').textContent = t;
let steps = [], res = [], meta = {}, recording = false, assertMode = false, base = '';
let rows = [], curId = null, dbOk = false, dbErr = '';
let running = false, dlgQueue = [], dlgSeen = [], curCtx = null; // dialog bawaan browser saat replay

/* ---------- auth ---------- */
async function boot() {
  if ((await api('ping')).ok) return loadDb();
  $('#login').hidden = false;
}
$('#loginBtn').onclick = async () => {
  const r = await api('login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
  if (r.ok) { $('#login').hidden = true; loadDb(); } else $('#pwerr').textContent = 'password salah';
};
// jangan return false dari onkeydown: itu memblokir ketikan
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };

/* ---------- skenario baru ---------- */
$('#new').onclick = () => {
  steps = []; res = []; meta = {}; curId = null; $('#name').value = ''; setRec(false); setAssert(false);
  render(); drawList(); say('Skenario baru. Buka URL lalu klik Rekam.');
};

/* ---------- daftar skenario di DB ---------- */
async function loadDb() {
  const hint = { 401: 'key ditolak: pakai service_role / secret key', 404: 'URL salah atau tabel "scenarios" belum dibuat', 403: 'role key belum punya izin ke tabel: jalankan perintah GRANT di README' };
  try {
    const r = await api('scenarios');
    dbOk = r.ok; dbErr = ''; rows = [];
    if (r.ok) rows = await r.json();
    else {
      const j = await r.json().catch(() => ({}));
      dbErr = `HTTP ${r.status}: ${j.error || j.message || ''} ${hint[r.status] || ''}`.trim();
    }
  } catch (e) { dbOk = false; dbErr = 'gagal menghubungi server: ' + e.message; rows = []; }
  drawList();
}
function drawList() {
  const k = $('#search').value.toLowerCase(), list = $('#items');
  list.innerHTML = '';
  const shown = rows.filter(x => x.name.toLowerCase().includes(k));
  if (!shown.length) {
    const p = document.createElement('div'); p.style.color = 'var(--mut)';
    p.textContent = dbOk ? 'Tidak ada skenario.' : 'Supabase error: ' + dbErr;
    list.append(p);
  }
  shown.forEach(x => {
    const b = document.createElement('button');
    b.textContent = x.name; b.title = new Date(x.created_at).toLocaleString();
    if (x.id === curId) b.className = 'cur';
    b.onclick = () => openDb(x.id);
    list.append(b);
  });
}
$('#search').oninput = drawList;
$('#reload').onclick = loadDb;
async function openDb(id) {
  const r = await api('scenarios?id=' + id);
  const row = r.ok && (await r.json())[0];
  if (!row) return say('Gagal membuka skenario.');
  load({ name: row.name, ...row.data }); curId = id; drawList();
}
$('#save').onclick = async () => {
  const name = $('#name').value.trim();
  if (!dbOk) return say('Supabase belum bisa dipakai: ' + dbErr);
  if (!name || !steps.length) return say('Isi nama skenario dan langkah dulu.');
  const ex = rows.find(x => x.name === name);
  if (ex && !confirm(`Skenario "${name}" sudah ada. Timpa?`)) return;
  const r = await api('scenarios' + (ex ? '?id=' + ex.id : ''), {
    method: ex ? 'PATCH' : 'POST', body: JSON.stringify({ name, data: { baseUrl: base, steps } }) });
  if (!r.ok) return say('Gagal simpan: ' + r.status);
  const saved = (await r.json())[0]; curId = saved?.id || null;
  say(`Tersimpan: ${name}`); loadDb();
};

/* ---------- panel tab ---------- */
let tabs = [], active = 0, nextId = 1;
const T = id => tabs.find(t => t.id === id);
const NEWT = t => t && !['_self', '_top', '_parent'].includes(t);
const mine = o => o === location.origin || o === base; // origin panel QA atau origin website target
function mkTab(id, name) {
  const fr = document.createElement('iframe');
  fr.name = name || 'qa-tab-' + id; fr.title = 'Tab ' + (id + 1);
  fr.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads');
  fr.onload = () => onLoad(id);
  const t = { id, f: fr, opener: null, label: 'Tab ' + (id + 1), reqs: [], navAt: 0, loadedAt: 0 };
  tabs.push(t); $('#frames').append(fr); show(id); return t;
}
const newTabFor = (opener, name) => { const t = mkTab(nextId++, name); t.opener = opener; return t; };
function show(id) {
  active = id;
  tabs.forEach(t => t.f.classList.toggle('act', t.id === id));
  drawTabs();
  try {
    const d = T(id).f.contentDocument;
    if (base && d.location.href !== 'about:blank') urlIn.value = base + d.location.pathname + d.location.search;
  } catch {}
}
function drawTabs() {
  const bar = $('#tabs'); bar.hidden = tabs.length < 2; bar.innerHTML = '';
  tabs.forEach(t => {
    const b = document.createElement('button'); b.textContent = t.label; b.onclick = () => show(t.id);
    if (t.id === active) b.className = 'cur';
    bar.append(b);
    if (t.id) {
      const x = document.createElement('button'); x.textContent = '×'; x.title = 'Tutup tab'; x.onclick = () => closeTab(t.id);
      bar.append(x);
    }
  });
}
function closeTab(id) {
  const t = T(id); if (!t || !id) return;
  tabs = tabs.filter(x => x !== t); t.f.remove();
  if (active === id) show((T(t.opener) || tabs[tabs.length - 1]).id); else drawTabs();
}
function resetTabs() { tabs.filter(t => t.id).forEach(t => t.f.remove()); tabs = tabs.filter(t => !t.id); nextId = 1; show(0); }
// Dipanggil hook.js (di dalam halaman target) dan onLoad: window.open/close/opener -> tab panel ini.
// Jendela di dalam iframe bersarang (mis. <dialog><iframe>) milik tab mana, dan jalur iframe-nya dari dokumen tab.
const tabOf = w => { try { for (let x = w; x; x = x.parent === x ? null : x.parent) { const t = tabs.find(k => k.f === x.frameElement); if (t) return t; } } catch {} return null; };
const framePath = w => {
  const out = [];
  try { for (let x = w; x && x.frameElement && !tabs.some(k => k.f === x.frameElement); x = x.parent) out.unshift(sel(x.frameElement)); } catch {}
  return out.join(' >> ');
};
window.__qa = { patch(w) {
  const t = tabOf(w);
  if (!t || w.__qaPatched) return; w.__qaPatched = 1;
  const nested = w.frameElement !== t.f; // iframe bersarang di dalam halaman tab
  attach(w.document, t.id, framePath(w)); // dipasang sejak awal parsing, bukan menunggu event load iframe
  const real = w.open.bind(w);
  w.open = (u, name) => {
    let href = null;
    try { if (u && u !== 'about:blank') href = new URL(u, w.location.href); } catch {}
    if (href && !mine(href.origin)) return real(u, name); // domain lain: tab browser asli
    const nm = name && !name.startsWith('_') ? name : '';
    const n = (nm && tabs.find(x => x.f.name === nm)) || newTabFor(t.id, nm);
    show(n.id);
    if (href) n.f.src = href.pathname + href.search + href.hash;
    return n.f.contentWindow;
  };
  // ---- dialog bawaan browser: saat merekam tetap tampil dan jawabanmu dicatat; saat replay dijawab otomatis ----
  // ---- status "halaman siap": navigasi berjalan, load event, permintaan XHR/fetch yang masih jalan ----
  w.addEventListener('beforeunload', () => { t.navAt = performance.now(); });
  w.addEventListener('load', () => { t.loadedAt = performance.now(); }, { once: true });
  const trk = () => { const st = performance.now(); t.reqs.push(st); return () => { const i = t.reqs.indexOf(st); if (i >= 0) t.reqs.splice(i, 1); }; };
  try {
    const xs = w.XMLHttpRequest.prototype.send;
    w.XMLHttpRequest.prototype.send = function (...a) { const done = trk(); this.addEventListener('loadend', done, { once: true }); return xs.apply(this, a); };
    const f0 = w.fetch;
    if (f0) w.fetch = (...a) => { const done = trk(), p = f0.apply(w, a); p.then(done, done); return p; };
  } catch {}
  const where = { ...(t.id ? { tab: t.id } : {}), ...(framePath(w) ? { frame: framePath(w) } : {}) };
  for (const kind of ['alert', 'confirm', 'prompt']) {
    const real = w[kind].bind(w);
    w[kind] = (msg, def) => {
      const text = msg === undefined ? '' : String(msg);
      if (running) return dialogAnswer(kind, text, def);
      const r = real(msg, def);
      if (recording) add({ action: 'dialog', kind, selector: text, ...where,
        value: kind === 'confirm' ? (r ? 'accept' : 'dismiss') : kind === 'prompt' ? (r === null ? 'dismiss' : 'accept:' + r) : 'accept' });
      return r;
    };
  }
  if (nested) return; // close/opener hanya untuk jendela tab
  w.close = () => closeTab(t.id);
  const op = t.opener !== null && T(t.opener);
  if (op) { try { Object.defineProperty(w, 'opener', { value: op.f.contentWindow, configurable: true, writable: true }); } catch {} }
} };
// <a target=_blank> dan <form target=_blank>: buka di tab panel baru. Navigasi dilakukan dari halaman induk,
// karena iframe ber-sandbox tidak boleh menavigasi iframe lain.
function openIn(tg, opener) {
  const n = (tg !== '_blank' && tabs.find(x => x.f.name === tg)) || newTabFor(opener, tg === '_blank' ? '' : tg);
  show(n.id); return n;
}
function submitInTab(fm, submitter, n) {
  const pf = document.createElement('form');
  pf.method = fm.method; pf.action = fm.action; pf.target = n.f.name; pf.enctype = fm.enctype; pf.hidden = true;
  for (const [k, v] of new FormData(fm, submitter)) { // shortcut: field file tidak ikut
    if (typeof v !== 'string') continue;
    const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; pf.append(i);
  }
  document.body.append(pf); pf.submit(); pf.remove();
}
function onLoad(id) {
  const t = T(id); if (!t || !base) return;
  let d; try { d = t.f.contentDocument; } catch { return; }
  if (!d || !d.location || d.location.href === 'about:blank') return;
  t.label = (d.title || d.location.pathname).slice(0, 18) || t.label;
  t.loadedAt = performance.now();
  window.__qa.patch(t.f.contentWindow);
  if (id === active) urlIn.value = base + d.location.pathname + d.location.search;
  attach(d, id); drawTabs();
}

/* ---------- navigasi ---------- */
function go(u) {
  try { u = new URL(/^https?:/i.test(u) ? u : 'https://' + u); } catch { return say('URL salah'); }
  base = u.origin; resetTabs();
  T(0).f.src = '/__qa/api/open?u=' + encodeURIComponent(u.href);
}
$('#go').onclick = () => go(urlIn.value);
urlIn.onkeydown = e => { if (e.key === 'Enter') go(urlIn.value); };

/* ---------- selector ---------- */
const q = s => CSS.escape(s);
function sel(el) {
  const d = el.ownerDocument;
  const one = s => { try { return d.querySelectorAll(s).length === 1; } catch { return false; } };
  const tag = el.tagName.toLowerCase();
  if (el.id && one('#' + q(el.id))) return '#' + q(el.id);
  for (const a of ['data-testid', 'name', 'aria-label']) {
    const v = el.getAttribute(a);
    if (v && one(`${tag}[${a}="${v}"]`)) return `${tag}[${a}="${v}"]`;
  }
  const t = el.matches('a,button,summary,label') && el.textContent.trim();
  if (t && t.length < 40 &&
      [...d.querySelectorAll('a,button,summary,label')].filter(x => x.textContent.trim() === t).length === 1)
    return 'text=' + t;
  const c = el.matches('td,th,li') && el.textContent.trim(); // baris/sel daftar data (popup F2): pilih lewat teks, bukan urutan
  if (c && c.length < 60 && [...d.querySelectorAll('td,th,li')].filter(x => x.textContent.trim() === c).length === 1)
    return 'cell=' + c;
  const path = []; let anchored = false;
  for (; el && el.nodeType === 1 && el !== d.body; el = el.parentElement) {
    if (el.id && one('#' + q(el.id))) { path.unshift('#' + q(el.id)); anchored = true; break; }
    const sib = [...el.parentElement.children].filter(x => x.tagName === el.tagName);
    path.unshift(el.tagName.toLowerCase() + (sib.length > 1 ? `:nth-of-type(${sib.indexOf(el) + 1})` : ''));
  }
  if (!anchored) path.unshift('body');
  return path.join(' > ');
}
// Halaman dianggap siap bila: tidak sedang navigasi, dokumen (+iframe bersarang) complete, gambar selesai, tidak ada XHR/fetch
// yang jalan (yang lebih dari 8 dtk diabaikan: long-poll/websocket), dan keadaan itu stabil `quiet` ms.
function docIdle(d) {
  if (!d) return true;
  if (d.readyState !== 'complete') return false;
  for (const im of d.images) if (!im.complete && im.loading !== 'lazy') return false;
  for (const f of d.querySelectorAll('iframe,frame')) {
    let fd = null; try { fd = f.contentDocument; } catch {}
    if (fd && fd.location.href !== 'about:blank' && !docIdle(fd)) return false;
  }
  return true;
}
function isIdle(t) {
  const now = performance.now();
  if (t.navAt > t.loadedAt && now - t.navAt < 20000) return false; // navigasi dimulai tapi belum selesai dimuat
  if (t.reqs.some(st => now - st < 8000)) return false;
  return docIdle(t.f.contentDocument);
}
async function settle(t, max = 15000, quiet = 300) {
  const start = performance.now(); let since = 0;
  for (;;) {
    let ok = true; try { ok = !tabs.includes(t) || isIdle(t); } catch {}
    const now = performance.now();
    if (!ok) since = 0; else if (!since) since = now;
    if (since && now - since >= quiet) return true;
    if (now - start > max) return false;
    await sleep(100);
  }
}
// Jawaban otomatis saat replay: diambil dari langkah `dialog` yang menyusul langkah pemicunya (dipasang di antrean sebelum langkah itu jalan).
function dialogAnswer(kind, text, def) {
  const h = dlgQueue[0], exp = h && h.kind === kind ? dlgQueue.shift() : null;
  dlgSeen.push({ kind, text, expIdx: exp ? exp.step : -1 });
  if (!exp && curCtx) curCtx.note = (curCtx.note ? curCtx.note + '; ' : '') + `dialog ${kind} tak terduga dijawab OK otomatis: "${text}"`;
  const accept = exp ? exp.value !== 'dismiss' : true;
  if (kind === 'confirm') return accept;
  if (kind === 'alert') return undefined;
  if (!accept) return null;
  return exp && exp.value.startsWith('accept:') ? exp.value.slice(7) : (def ?? '');
}
function frameDoc(top, path) { // path: '#a >> #b' = selector tiap iframe di dokumen induknya
  let d = top;
  for (const sl of path.split(' >> ')) { const fe = find(d, sl); if (!fe || !fe.contentDocument) return null; d = fe.contentDocument; }
  return d;
}
function find(d, s) {
  if (s.startsWith('text='))
    return [...d.querySelectorAll('a,button,summary,label,[role=button]')].find(x => x.textContent.trim() === s.slice(5));
  if (s.startsWith('cell='))
    return [...d.querySelectorAll('td,th,li')].find(x => x.textContent.trim() === s.slice(5));
  try { return d.querySelector(s); } catch { return null; }
}

/* ---------- rekam ---------- */
function add(s) {
  const last = steps[steps.length - 1];
  if (last && last.action === 'type' && s.action === 'type' && last.selector === s.selector && last.tab === s.tab && last.frame === s.frame) last.value = s.value;
  else steps.push(s);
  res = []; render();
}
const typeStep = (el, tab, frame) => {
  const s = { action: el.tagName === 'SELECT' ? 'select' : 'type', selector: sel(el), value: el.value };
  if (tab) s.tab = tab;
  if (frame) s.frame = frame;
  if (el.type === 'password') s.sensitive = true; // disamarkan di laporan; JSON tetap menyimpan nilainya
  return s;
};
// nilai yang sama sudah tercatat tepat sebelumnya (boleh diselingi langkah press)? mis. blur karena popup F2 memicu change lagi
const dupType = ts => {
  for (let i = steps.length - 1; i >= 0; i--) {
    const x = steps[i];
    if (x.action === 'press' && (x.tab || 0) === (ts.tab || 0) && (x.frame || '') === (ts.frame || '')) continue;
    return (x.action === 'type' || x.action === 'select') && x.selector === ts.selector && x.value === ts.value && (x.tab || 0) === (ts.tab || 0) && (x.frame || '') === (ts.frame || '');
  }
  return false;
};
// Field yang isinya diketik user. Klik di sini hanya memberi fokus (tidak direkam); tombol bergambar/reset/file dan sejenisnya
// BUKAN termasuk: kliknya harus direkam.
const TEXTY = 'input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=image]):not([type=reset]):not([type=file]):not([type=range]):not([type=color]):not([type=hidden]),textarea,select';
// Nama yang dibaca manusia untuk elemen (title, alt, value tombol, teks), untuk laporan. Tombol ikon biasanya hanya punya title/alt.

  m.rows.forEach(r => {
    body += p(`${r.n}. ${r.desc} - ${lab(m, r.st)}`, { b: 1, c: col[r.st] });
    if (r.err) body += p(`${t.err}: ${r.err}`, { c: col.fail });
    body += p(`${t.dur}: ${r.ms} ms`, { sz: 18 });
    if (r.note) body += p(r.note, { sz: 18 });
    if (r.before) body += p(t.before, { b: 1, sz: 20 }) + (r.before.img ? pic(r.before.img, r.before.iw, r.before.ih, `Step ${r.n} before`) : p(noshot(t, r.before), { sz: 18 }));
    if (r.img) body += (r.before ? p(t.after, { b: 1, sz: 20 }) : '') + pic(r.img, r.iw, r.ih, `Step ${r.n}`);
    else if (r.st !== 'skip') body += p(noshot(t, r), { sz: 18 });
  });
  if (m.final) {
    body += p(t.final, { b: 1, sz: 32 }) + p(m.overall === 'pass' ? t.finalOk : t.finalFail);
    body += m.final.img ? pic(m.final.img, m.final.iw, m.final.ih, t.final) : p(noshot(t, m.final), { sz: 18 });
  }
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  z.file('[Content_Types].xml', `${H}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  z.file('_rels/.rels', `${H}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  z.file('word/_rels/document.xml.rels', `${H}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`);
  z.file('word/document.xml', `${H}<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}</w:body></w:document>`);
  return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
$('#exp').onclick = async () => {
  if (!res.length) return;
  const m = model($('#lang').value), fmt = $('#fmt').value, name = slug(m.title) + '-hasil';
  if (fmt === 'html') dl(new Blob([toHtml(m)], { type: 'text/html' }), name + '.html');
  else if (fmt === 'md') dl(new Blob([toMd(m)], { type: 'text/markdown' }), name + '.md');
  else if (fmt === 'docx') dl(await toDocx(m), name + '.docx');
  else { // shortcut: PDF lewat dialog cetak browser ("Simpan sebagai PDF"); upgrade ke PDF sisi server bila perlu satu klik
    const w = open('', '_blank');
    if (!w) return say('Popup diblokir. Izinkan popup, lalu coba lagi.');
    w.document.write(toHtml(m)); w.document.close(); setTimeout(() => w.print(), 600);
  }
};

mkTab(0);
boot();
</script>
</body>
